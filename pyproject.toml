[project]
name = "dj-mix"
version = "0.1.0"
description = "Beat-matched, EQ-crossfaded DJ mixes (and YouTube videos) from a folder of tracks"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "librosa>=0.10",
    "numpy",
    "scipy",
    "soundfile",
    "pillow",
    "textual>=0.80",
    "sounddevice>=0.5.6",
]

[project.scripts]
dj-mix = "djmix.cli:main"

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/djmix"]
